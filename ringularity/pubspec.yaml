name: ringularity
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  scrollable_positioned_list: ^0.3.8
  flutter_blue_plus: ^1.30.0
  provider: ^6.1.1
  permission_handler: ^11.3.0
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  google_fonts: ^8.0.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.2
  google_maps_flutter_android: ^2.18.12
  google_maps_flutter_platform_interface: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.0

flutter_native_splash:
  color: "#000000"
  image: assets/loader/first_loader_asset.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  bg_color_ios: "#101824"
  adaptive_icon_background: "#101824"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/loader/
